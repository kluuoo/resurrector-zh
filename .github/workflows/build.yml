name: Build and Release Resurrector ZH

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false 

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Install Wails v2 CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    # 1. 强制生成合法的 1x1 透明 ico，完美骗过 go:embed，杜绝报错
    - name: Generate Placeholder Icon
      shell: pwsh
      run: |
        $base64 = "AAABAAEAAQEAAAEAIAAwAAAAFgAAACgAAAABAAAAAgAAAAEAIAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAD///8AAAAAAA=="
        $bytes = [Convert]::FromBase64String($base64)
        [IO.File]::WriteAllBytes("core/icon.ico", $bytes)
        Write-Host "✅ Icon.ico 已成功生成"

    # 2. 彻底解决 go.work 多模块依赖查找问题
    - name: Sync Go Workspace
      run: go work sync

    # 3. 编译核心程序 (核心程序必须加 -H windowsgui 才能隐藏那个黑框)
    - name: Build Core App
      run: go build -ldflags="-H windowsgui" -o core/resurrector.exe ./core

    # 4. 编译 UI 界面程序 (极致纯净，仅指定隐藏黑框)
    - name: Build UI App
      working-directory: ./ui
      run: wails build -clean -ldflags="-H windowsgui"

    # 5. 构建发布目录 (加入终极容错，自动改名)
    - name: Prepare Release Folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path Release
        
        # 移动核心程序
        Copy-Item -Path "core\resurrector.exe" -Destination "Release\"
        
        # 找到 Wails 编译出的界面程序并强制重命名
        $uiExe = Get-ChildItem -Path "ui\build\bin\*.exe" | Select-Object -First 1
        if ($null -ne $uiExe) {
            Copy-Item -Path $uiExe.FullName -Destination "Release\resurrector-ui.exe"
            Write-Host "✅ UI 程序已重命名为 resurrector-ui.exe"
        } else {
            Write-Error "❌ 找不到 Wails 编译出的 UI 程序！"
            exit 1
        }
        
        # 列出最终产物，方便在日志中确认
        Get-ChildItem -Path "Release" | Format-Table Name, Length

    # 6. 打包
    - name: Upload Final Package
      uses: actions/upload-artifact@v4
      with:
        name: Resurrector-ZH-Release
        path: Release/
        if-no-files-found: error
